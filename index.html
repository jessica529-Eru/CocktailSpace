<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eru's Cocktail Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<!-- 獅尾四季春 via jsdelivr CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/max32002/swei-spring@2.112/WebFont/WebFont_Traditional_400.css">
<style>
:root{
  /* 深霧咖啡色系 */
  --bg:#1a1612;
  --bg2:#1f1b16;
  --surface:#252018;
  --surface2:#2c2620;
  --surface3:#332e27;
  --border:#3a332a;
  --border2:#443c32;

  /* 金色系 accent */
  --gold:#c8a96e;
  --gold2:#dfc08a;
  --gold-dim:rgba(200,169,110,0.15);

  /* 家族色 */
  --OF:#c8a96e; --MA:#7eb8a4; --DA:#e07a7a;
  --SI:#b07ec8; --HI:#7eaac8; --FL:#c8b07e; --CU:#9a9288;

  /* 文字 */
  --text:#ede7dc;
  --text2:#c8bfb2;
  --muted:#7a7068;
  --dim:#524a40;

  --radius:8px;
  --font-zh:'Swei Spring','Cormorant Garamond',serif;
  --font-en:'Cormorant Garamond',serif;
  --font-mono:'DM Mono',monospace;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-zh);
  min-height:100vh;
  font-size:14px;
  overscroll-behavior:none;
}

/* ── HERO ── */
.hero{
  background:var(--bg2);
  padding:16px 18px 14px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:60;
}
.hero-inner{display:flex;align-items:center;gap:14px;}
.hero-svg{flex-shrink:0;}
.hero-text h1{
  font-family:var(--font-en);
  font-size:21px;font-weight:300;
  color:var(--gold2);
  letter-spacing:.06em;line-height:1.15;
  font-style:italic;
}
.hero-text h1 em{font-style:normal;font-weight:600;}
.hero-text p{
  font-size:10px;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase;
  margin-top:3px;font-family:var(--font-mono);
}

/* ── TABS ── */
.tabs{
  display:flex;background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:sticky;top:65px;z-index:59;
}
.tab{
  flex:1;padding:11px 4px;text-align:center;
  font-size:11px;color:var(--muted);
  border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;
  letter-spacing:.06em;
  font-family:var(--font-mono);
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── TOOLBAR ── */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);}
.sbar{padding:10px 16px;}
.sbar input{
  width:100%;background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:9px 14px;color:var(--text);
  font-size:13px;outline:none;
  font-family:var(--font-zh);
}
.sbar input:focus{border-color:var(--gold);}
.sbar input::placeholder{color:var(--muted);}
.fscroll{
  display:flex;gap:6px;padding:0 16px 10px;
  overflow-x:auto;scrollbar-width:none;
}
.fscroll::-webkit-scrollbar{display:none;}
.fbtn{
  flex-shrink:0;padding:5px 12px;border-radius:20px;
  border:1px solid var(--border2);background:none;
  color:var(--muted);font-size:11px;cursor:pointer;
  white-space:nowrap;font-family:var(--font-mono);
  transition:all .15s;
}
.fbtn.active{color:#1a1612!important;border-color:transparent;font-weight:600;}
.f-ALL.active{background:var(--text2);}
.f-OF.active{background:var(--OF);}.f-MA.active{background:var(--MA);}
.f-DA.active{background:var(--DA);}.f-SI.active{background:var(--SI);}
.f-HI.active{background:var(--HI);}.f-FL.active{background:var(--FL);}
.f-CU.active{background:var(--CU);}
.rcount{
  padding:5px 16px;font-size:10px;
  color:var(--muted);letter-spacing:.06em;
  font-family:var(--font-mono);
}

/* ── LIST ── */
#lview{display:block;}
#fview,#aview{display:none;}

.ci{
  display:flex;align-items:center;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  gap:12px;cursor:pointer;
  transition:background .12s;
}
.ci:active{background:var(--surface);}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.d-OF{background:var(--OF);}.d-MA{background:var(--MA);}.d-DA{background:var(--DA);}
.d-SI{background:var(--SI);}.d-HI{background:var(--HI);}.d-FL{background:var(--FL);}.d-CU{background:var(--CU);}
.cinfo{flex:1;min-width:0;}
.cen{
  font-family:var(--font-en);font-size:17px;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);line-height:1.2;
}
.czh{font-size:11px;color:var(--muted);margin-top:1px;}
.ctags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.tag{
  font-size:10px;padding:2px 6px;
  background:var(--surface2);color:var(--muted);
  border-radius:3px;font-family:var(--font-mono);
}
.cright{text-align:right;flex-shrink:0;}
.cmeth{font-size:10px;color:var(--dim);font-family:var(--font-mono);}
.cdone{font-size:10px;color:var(--MA);margin-top:2px;}
.cchev{font-size:16px;color:var(--border2);margin-top:3px;}

/* ── DETAIL MODAL ── */
.mbg{
  display:none;position:fixed;inset:0;
  background:rgba(15,12,9,0.92);
  z-index:200;overflow-y:auto;
}
.mbg.open{display:block;}
.mbox{
  background:var(--surface);
  margin:50px 10px 30px;
  border-radius:12px;overflow:hidden;position:relative;
  border:1px solid var(--border2);
}
.m-topbar{
  display:flex;justify-content:flex-end;
  gap:8px;padding:12px 14px 0;
}
.mbtn{
  padding:5px 13px;border-radius:20px;
  font-size:11px;cursor:pointer;
  font-family:var(--font-mono);letter-spacing:.04em;
  border:1px solid;transition:opacity .15s;
}
.mbtn:active{opacity:.75;}
.mbtn-edit{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
.mbtn-del{border-color:#c87070;color:#c87070;background:rgba(200,112,112,.08);}
.mbtn-close{border-color:var(--border2);color:var(--muted);background:none;}

.mhead{padding:16px 18px 14px;border-bottom:1px solid var(--border);}
.mfam-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-family:var(--font-mono);}
.men-title{font-family:var(--font-en);font-size:26px;font-weight:400;font-style:italic;line-height:1.2;}
.mzh-title{font-size:13px;color:var(--muted);margin-top:3px;}
.mdone-badge{
  display:inline-block;margin-top:6px;
  padding:3px 8px;background:rgba(126,184,164,.12);
  color:var(--MA);border-radius:3px;
  font-size:10px;font-family:var(--font-mono);letter-spacing:.06em;
}

.mbody{padding:0 18px 28px;}
.msec{margin-top:18px;}
.mlbl{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
  font-family:var(--font-mono);
}
.rlines{display:flex;flex-direction:column;gap:4px;}
.rline{
  font-size:12.5px;padding:8px 12px;
  background:var(--surface2);border-radius:5px;
  line-height:1.4;font-family:var(--font-mono);
}
.ramt{color:var(--gold);font-weight:500;margin-right:5px;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mcell{background:var(--surface2);padding:9px 12px;border-radius:5px;}
.mcell .lbl{
  font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  display:block;margin-bottom:3px;font-family:var(--font-mono);
}
.mcell .val{font-size:12px;line-height:1.4;}
.ftags{display:flex;flex-wrap:wrap;gap:5px;}
.fchip{
  padding:4px 10px;background:var(--surface2);
  border-radius:20px;font-size:11px;color:var(--text2);
}
.sbox{
  padding:10px 13px;border-radius:0 5px 5px 0;
  font-size:12px;line-height:1.7;
}
.sbox-note{background:var(--surface2);border-left:2px solid var(--gold);color:var(--text2);}
.sbox-brand{background:var(--surface2);border-left:2px solid var(--MA);color:#9ed4c4;}
.sbox-hist{background:var(--surface2);border-left:2px solid var(--SI);color:#c4a8d8;}

/* ── EDIT MODAL ── */
.ebg{
  display:none;position:fixed;inset:0;
  background:rgba(15,12,9,0.94);
  z-index:300;overflow-y:auto;
}
.ebg.open{display:block;}
.ebox{
  background:var(--surface);
  margin:50px 10px 30px;
  border-radius:12px;overflow:hidden;
  border:1px solid var(--border2);
}
.ehead{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-start;
}
.ehead h2{
  font-family:var(--font-en);
  font-size:20px;font-weight:400;font-style:italic;
  color:var(--gold);
}
.ehead p{font-size:11px;color:var(--muted);margin-top:3px;}
.eclose-btn{
  padding:5px 12px;border-radius:20px;
  border:1px solid var(--border2);background:none;
  color:var(--muted);font-size:11px;cursor:pointer;
  font-family:var(--font-mono);flex-shrink:0;margin-top:2px;
}
.ebody{padding:16px 18px 28px;display:flex;flex-direction:column;gap:12px;}
.erow{display:flex;flex-direction:column;gap:5px;}
.erow label{
  font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  font-family:var(--font-mono);
}
.erow input,.erow select,.erow textarea{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--radius);padding:9px 11px;
  color:var(--text);font-size:13px;outline:none;
  font-family:var(--font-zh);width:100%;
  transition:border-color .15s;
}
.erow input:focus,.erow select:focus,.erow textarea:focus{border-color:var(--gold);}
.erow textarea{resize:vertical;min-height:70px;line-height:1.6;}
.erow select option{background:var(--surface2);}
.erow .hint{font-size:10px;color:var(--muted);margin-top:2px;font-style:italic;font-family:var(--font-mono);}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.esave-btn{
  width:100%;padding:13px;border-radius:var(--radius);
  border:none;background:var(--gold);color:#1a1612;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:var(--font-zh);margin-top:4px;
  transition:opacity .15s;
}
.esave-btn:active{opacity:.82;}
.ecancel-btn{
  width:100%;padding:11px;border-radius:var(--radius);
  border:1px solid var(--border2);background:none;
  color:var(--muted);font-size:13px;cursor:pointer;
  font-family:var(--font-mono);margin-top:6px;
}
.echk-row{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--text2);
}

/* ── FLASH ── */
.fwrap{
  padding:20px 16px;display:flex;
  flex-direction:column;align-items:center;
}
.fprog{
  font-size:11px;color:var(--muted);
  margin-bottom:14px;letter-spacing:.06em;
  font-family:var(--font-mono);
}
.fcard{
  width:100%;max-width:400px;
  background:var(--surface);border-radius:12px;
  border:1px solid var(--border2);
  padding:28px 22px;text-align:center;
  min-height:220px;display:flex;
  flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;
  transition:background .12s;
}
.fcard:active{background:var(--surface2);}
.ftap{
  font-size:10px;color:var(--dim);
  letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:14px;font-family:var(--font-mono);
}
.fen-flash{
  font-family:var(--font-en);font-size:27px;
  font-style:italic;margin-bottom:5px;line-height:1.2;
}
.fzh-name{font-size:13px;color:var(--muted);margin-bottom:14px;}
.fans{
  width:100%;text-align:left;
  border-top:1px solid var(--border);padding-top:13px;
}
.frow{
  display:flex;justify-content:space-between;
  padding:5px 0;border-bottom:1px solid var(--border);gap:10px;
}
.frow:last-child{border-bottom:none;}
.flbl{font-size:10px;color:var(--muted);flex-shrink:0;width:38px;font-family:var(--font-mono);}
.fval{font-size:11px;color:var(--text2);text-align:right;flex:1;line-height:1.5;font-family:var(--font-mono);}
.fbtns{display:flex;gap:8px;margin-top:16px;width:100%;max-width:400px;}
.fbbtn{
  flex:1;padding:12px 8px;border-radius:var(--radius);
  border:1px solid var(--border2);background:var(--surface);
  color:var(--muted);font-size:13px;cursor:pointer;
  font-family:var(--font-mono);transition:border-color .15s;
}
.fbbtn.p{border-color:var(--gold);color:var(--gold);}
.fshuffle{
  width:100%;max-width:400px;margin-top:8px;
  padding:11px;border-radius:var(--radius);
  border:1px solid var(--border);background:none;
  color:var(--muted);font-size:12px;cursor:pointer;
  font-family:var(--font-mono);letter-spacing:.04em;
}

/* ── ADD VIEW ── */
.awrap{padding:20px 16px;}
.awrap h2{
  font-family:var(--font-en);font-size:22px;
  font-weight:400;font-style:italic;
  color:var(--gold);margin-bottom:3px;
}
.awrap .sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6;}

/* ── CONFIRM DIALOG ── */
.cbg{
  display:none;position:fixed;inset:0;
  background:rgba(15,12,9,0.94);
  z-index:400;align-items:center;
  justify-content:center;padding:20px;
}
.cbg.open{display:flex;}
.cbox{
  background:var(--surface);border-radius:12px;
  padding:24px 20px;max-width:320px;width:100%;
  border:1px solid var(--border2);
}
.cbox h3{font-size:17px;margin-bottom:8px;color:var(--text);}
.cbox p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
.cbox-btns{display:flex;gap:8px;}
.cbtn-cancel{
  flex:1;padding:11px;border-radius:var(--radius);
  border:1px solid var(--border2);background:none;
  color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--font-mono);
}
.cbtn-del{
  flex:1;padding:11px;border-radius:var(--radius);
  border:none;background:#c87070;color:#fff;
  font-size:13px;cursor:pointer;font-family:var(--font-mono);font-weight:600;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--surface3);border:1px solid var(--border2);
  color:var(--text);padding:10px 20px;border-radius:30px;
  font-size:12px;opacity:0;transition:all .28s;
  z-index:500;white-space:nowrap;pointer-events:none;
  font-family:var(--font-mono);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── MEASURE NOTE ── */
.measure-note{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--radius);padding:8px 12px;
  font-size:11px;color:var(--muted);margin-bottom:16px;
  font-family:var(--font-mono);line-height:1.6;
}
.measure-note span{color:var(--gold);}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 7 L25 29 L25 41" stroke="#c8a96e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41 7 L25 29" stroke="#c8a96e" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="7" y1="7" x2="43" y2="7" stroke="#c8a96e" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="17" y1="41" x2="33" y2="41" stroke="#c8a96e" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M13 16 L22.5 27 L27.5 27 L37 16" stroke="#c8a96e" stroke-width=".7" stroke-linecap="round" opacity=".35"/>
      <circle cx="37" cy="6.5" r="2.5" stroke="#e07a7a" stroke-width="1" fill="none"/>
      <line x1="35.2" y1="4.8" x2="32" y2="2" stroke="#7eb8a4" stroke-width="1" stroke-linecap="round"/>
      <line x1="33" y1="9" x2="41" y2="4" stroke="#c8a96e" stroke-width=".8" stroke-linecap="round" opacity=".55"/>
      <circle cx="19" cy="20" r=".9" fill="#c8a96e" opacity=".45"/>
      <circle cx="22" cy="24" r=".65" fill="#c8a96e" opacity=".3"/>
    </svg>
    <div class="hero-text">
      <h1><em>Eru's</em> Cocktail Space</h1>
      <p id="hdrcount">載入中…</p>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" id="tab-l" onclick="switchTab('l')">📋 瀏覽</button>
  <button class="tab" id="tab-f" onclick="switchTab('f')">🃏 閃卡</button>
  <button class="tab" id="tab-a" onclick="switchTab('a')">＋ 新增</button>
</div>

<!-- LIST VIEW -->
<div id="lview">
  <div class="toolbar">
    <div class="sbar"><input type="text" id="sinput" placeholder="搜尋酒名、材料、風味、歷史…" oninput="doFilter()"></div>
    <div class="fscroll">
      <button class="fbtn f-ALL active" onclick="setFam('ALL')">全部</button>
      <button class="fbtn f-OF" onclick="setFam('OF')">🟤 Old-Fashioned</button>
      <button class="fbtn f-MA" onclick="setFam('MA')">🟢 Martini</button>
      <button class="fbtn f-DA" onclick="setFam('DA')">🔴 Daiquiri</button>
      <button class="fbtn f-SI" onclick="setFam('SI')">🟣 Sidecar</button>
      <button class="fbtn f-HI" onclick="setFam('HI')">🔵 Highball</button>
      <button class="fbtn f-FL" onclick="setFam('FL')">🟡 Flip</button>
      <button class="fbtn f-CU" onclick="setFam('CU')">⚪ 自訂</button>
    </div>
    <div class="rcount" id="rcount">—</div>
  </div>
  <div id="clist"></div>
</div>

<!-- FLASH VIEW -->
<div id="fview">
  <div class="fwrap">
    <div class="fprog" id="fprog">1 / —</div>
    <div class="fcard" id="fcard" onclick="revealCard()">
      <div class="ftap" id="ftap">點擊翻牌</div>
      <div class="fen-flash" id="fen-f"></div>
      <div class="fzh-name" id="fzh-f"></div>
      <div class="fans" id="fans" style="display:none"></div>
    </div>
    <div class="fbtns">
      <button class="fbbtn" onclick="flashPrev()">← 上一張</button>
      <button class="fbbtn p" onclick="flashNext()">下一張 →</button>
    </div>
    <button class="fshuffle" onclick="flashShuffle()">🔀 隨機排序</button>
  </div>
</div>

<!-- ADD VIEW -->
<div id="aview">
  <div class="awrap">
    <h2>新增酒譜</h2>
    <p class="sub">自創酒、課堂補充、任何你想記的都可以加進來。<br>儲存在這個裝置的瀏覽器中。</p>
    <div class="measure-note">
      🇮🇪 愛爾蘭計量單位：<span>Single = 25ml</span>，<span>Double = 50ml</span>，<span>½ single = 12.5ml</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="twocol">
        <div class="erow"><label>英文名稱 *</label><input type="text" id="a-en" placeholder="e.g. My Spritz"></div>
        <div class="erow"><label>中文名稱</label><input type="text" id="a-zh" placeholder="選填"></div>
      </div>
      <div class="twocol">
        <div class="erow"><label>原型家族</label>
          <select id="a-fam">
            <option value="CU">⚪ 自訂</option><option value="OF">🟤 Old-Fashioned</option>
            <option value="MA">🟢 Martini</option><option value="DA">🔴 Daiquiri</option>
            <option value="SI">🟣 Sidecar</option><option value="HI">🔵 Highball</option><option value="FL">🟡 Flip</option>
          </select>
        </div>

// ── STORAGE ──
var SK='erus_v3';
function loadState(){try{return JSON.parse(localStorage.getItem(SK)||'{}');}catch(e){return{};}}
function saveState(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
var ST=loadState();
if(!ST.overrides)ST.overrides={};
if(!ST.deleted)ST.deleted=[];
if(!ST.custom)ST.custom=[];

function buildAll(){
  var arr=[];
  BASE.forEach(function(c,i){
    if(ST.deleted.indexOf('b'+i)>=0)return;
    var m=Object.assign({},c,ST.overrides['b'+i]||{});
    m._id='b'+i;arr.push(m);
  });
  ST.custom.forEach(function(c,i){
    if(ST.deleted.indexOf('c'+i)>=0)return;
    var m=Object.assign({},c,ST.overrides['c'+i]||{});
    m._id='c'+i;arr.push(m);
  });
  return arr;
}

var ALL=buildAll();
var curFam='ALL',filtered=ALL.slice(),fList=ALL.slice(),fIdx=0,fShown=false,curId=null;

function updateHeader(){
  var cu=ST.custom.filter(function(_,i){return ST.deleted.indexOf('c'+i)<0;}).length;
  document.getElementById('hdrcount').textContent=ALL.length+' recipes'+(cu?' · '+cu+' custom':'');
}

// ── FILTER ──
function setFam(x){
  curFam=x;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
  var s=document.querySelector('.f-'+x);if(s)s.classList.add('active');
  doFilter();
}
function doFilter(){
  var q=document.getElementById('sinput').value.toLowerCase();
  filtered=ALL.filter(function(c){
    var fok=curFam==='ALL'||c.f===curFam;
    var qok=!q||[c.en,c.zh,(c.s||[]).join(' '),(c.r||[]).join(' '),(c.fl||[]).join(' '),c.n||'',c.brand||'',c.hist||''].some(function(t){return t.toLowerCase().indexOf(q)>=0;});
    return fok&&qok;
  });
  document.getElementById('rcount').textContent=filtered.length+' 款';
  document.getElementById('clist').innerHTML=filtered.map(function(c){
    var isC=c._id.charAt(0)==='c';
    return '<div class="ci" onclick="openModal(\''+c._id+'\')">'+
      '<div class="cdot d-'+c.f+'"></div>'+
      '<div class="cinfo">'+
        '<div class="cen">'+c.en+'</div>'+
        '<div class="czh">'+c.zh+(isC?' <span style="font-size:9px;color:#9a9288">✦</span>':'')+'</div>'+
        '<div class="ctags">'+
          (c.s||[]).slice(0,2).map(function(x){return '<span class="tag">'+x+'</span>';}).join('')+
          (c.fl||[]).slice(0,2).map(function(x){return '<span class="tag">'+x+'</span>';}).join('')+
        '</div>'+
      '</div>'+
      '<div class="cright"><div class="cmeth">'+c.m+'</div>'+(c.done?'<div class="cdone">✓ 做過</div>':'')+'<div class="cchev">›</div></div>'+
    '</div>';
  }).join('');
  fList=filtered.slice();fIdx=0;
  if(document.getElementById('fview').style.display!=='none')renderFlash();
}

// ── MODAL ──
function getC(id){return ALL.filter(function(c){return c._id===id;})[0]||null;}
function openModal(id){
  var c=getC(id);if(!c)return;
  curId=id;
  var fm=FC[c.f]||FC.CU;
  var html='<div class="mhead"><div class="mfam-label" style="color:'+fm.c+'">'+fm.l+' Family</div>'+
    '<div class="men-title">'+c.en+'</div>'+
    '<div class="mzh-title">'+c.zh+'</div>'+
    (c.done?'<div class="mdone-badge">✓ 上課做過</div>':'')+
  '</div><div class="mbody">';
  // Recipe
  html+='<div class="msec"><div class="mlbl">配方</div><div class="rlines">'+(c.r||[]).map(function(r){
    var m=r.match(/^(\d+(?:\.\d+)?ml|[¼½¾\d]+\s*tsp|[¼½¾\d]+\s*dash)\s+(.+)$/i);
    return m?'<div class="rline"><span class="ramt">'+m[1]+'</span>'+m[2]+'</div>':'<div class="rline">'+r+'</div>';
  }).join('')+'</div></div>';
  // Meta
  html+='<div class="msec"><div class="mlbl">基本資訊</div><div class="mgrid">'+
    '<div class="mcell"><span class="lbl">技法</span><span class="val">'+c.m+'</span></div>'+
    '<div class="mcell"><span class="lbl">杯型</span><span class="val">'+c.g+'</span></div>'+
    '<div class="mcell"><span class="lbl">基酒</span><span class="val">'+(c.s||[]).join(', ')+'</span></div>'+
    '<div class="mcell"><span class="lbl">原型</span><span class="val">'+fm.l+'</span></div>'+
  '</div></div>';
  // Flavor
  if(c.fl&&c.fl.length)html+='<div class="msec"><div class="mlbl">風味</div><div class="ftags">'+(c.fl||[]).map(function(x){return '<span class="fchip">'+x+'</span>';}).join('')+'</div></div>';
  if(c.brand)html+='<div class="msec"><div class="mlbl">🍾 廠牌 / 種類建議</div><div class="sbox sbox-brand">'+c.brand+'</div></div>';
  if(c.hist)html+='<div class="msec"><div class="mlbl">📜 歷史根源</div><div class="sbox sbox-hist">'+c.hist+'</div></div>';
  if(c.n)html+='<div class="msec"><div class="mlbl">📝 重點筆記</div><div class="sbox sbox-note">'+c.n+'</div></div>';
  html+='</div>';
  document.getElementById('mcontent').innerHTML=html;
  document.getElementById('mbg').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('mbg').classList.remove('open');document.body.style.overflow='';curId=null;}
function tryCloseM(e){if(e.target===document.getElementById('mbg'))closeModal();}

// ── EDIT ──
function openEdit(){
  var c=getC(curId);if(!c)return;
  document.getElementById('edit-sub').textContent=c.en;
  document.getElementById('e-en').value=c.en||'';
  document.getElementById('e-zh').value=c.zh||'';
  document.getElementById('e-fam').value=c.f||'CU';
  var ms=document.getElementById('e-meth');
  var found=false;
  for(var i=0;i<ms.options.length;i++){if(ms.options[i].value===c.m){ms.selectedIndex=i;found=true;break;}}
  if(!found){var o=document.createElement('option');o.value=c.m;o.text=c.m;ms.appendChild(o);ms.value=c.m;}
  document.getElementById('e-glass').value=c.g||'';
  document.getElementById('e-spirit').value=(c.s||[]).join(', ');
  document.getElementById('e-recipe').value=(c.r||[]).join('\n');
  document.getElementById('e-flavor').value=(c.fl||[]).join(', ');
  document.getElementById('e-brand').value=c.brand||'';
  document.getElementById('e-hist').value=c.hist||'';
  document.getElementById('e-note').value=c.n||'';
  document.getElementById('e-done').checked=!!c.done;
  document.getElementById('ebg').classList.add('open');
}
function closeEdit(){document.getElementById('ebg').classList.remove('open');}
function tryCloseE(e){if(e.target===document.getElementById('ebg'))closeEdit();}
function saveEdit(){
  if(!curId)return;
  var p={
    en:document.getElementById('e-en').value.trim(),
    zh:document.getElementById('e-zh').value.trim(),
    f:document.getElementById('e-fam').value,
    m:document.getElementById('e-meth').value,
    g:document.getElementById('e-glass').value.trim(),
    s:document.getElementById('e-spirit').value.split(',').map(function(x){return x.trim();}).filter(Boolean),
    r:document.getElementById('e-recipe').value.split('\n').map(function(x){return x.trim();}).filter(Boolean),
    fl:document.getElementById('e-flavor').value.split(',').map(function(x){return x.trim();}).filter(Boolean),
    brand:document.getElementById('e-brand').value.trim(),
    hist:document.getElementById('e-hist').value.trim(),
    n:document.getElementById('e-note').value.trim(),
    done:document.getElementById('e-done').checked
  };
  if(!p.en){showToast('⚠️ 英文名稱不能為空');return;}
  ST.overrides[curId]=p;saveState();
  ALL=buildAll();doFilter();updateHeader();
  closeEdit();openModal(curId);
  showToast('✓ 已儲存');
}

// ── DELETE ──
function confirmDelete(){
  var c=getC(curId);if(!c)return;
  document.getElementById('cdesc').textContent='確定刪除「'+c.en+'」？';
  document.getElementById('cbg').classList.add('open');
}
function doDelete(){
  if(!curId)return;
  ST.deleted.push(curId);saveState();
  ALL=buildAll();doFilter();updateHeader();
  document.getElementById('cbg').classList.remove('open');
  closeModal();showToast('已刪除');
}

// ── ADD ──
function addCustom(){
  var en=document.getElementById('a-en').value.trim();
  if(!en){showToast('⚠️ 請輸入英文名稱');return;}
  var c={
    en:en,zh:document.getElementById('a-zh').value.trim()||en,
    f:document.getElementById('a-fam').value,m:document.getElementById('a-meth').value,
    g:document.getElementById('a-glass').value.trim()||'—',
    s:document.getElementById('a-spirit').value.split(',').map(function(x){return x.trim();}).filter(Boolean),
    r:document.getElementById('a-recipe').value.split('\n').map(function(x){return x.trim();}).filter(Boolean),
    fl:document.getElementById('a-flavor').value.split(',').map(function(x){return x.trim();}).filter(Boolean),
    brand:document.getElementById('a-brand').value.trim(),
    hist:document.getElementById('a-hist').value.trim(),
    n:document.getElementById('a-note').value.trim(),
    done:document.getElementById('a-done').checked
  };
  ST.custom.push(c);saveState();
  ALL=buildAll();doFilter();updateHeader();
  ['a-en','a-zh','a-glass','a-spirit','a-recipe','a-flavor','a-brand','a-hist','a-note'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('a-done').checked=false;
  showToast('✓ 已加入：'+en);
  switchTab('l');
}

// ── FLASH ──
function renderFlash(){
  if(!fList.length){
    document.getElementById('fen-f').textContent='—';
    document.getElementById('fzh-f').textContent='沒有符合的酒款';
    document.getElementById('fans').style.display='none';
    document.getElementById('ftap').style.display='block';
    return;
  }
  var c=fList[fIdx],fm=FC[c.f]||FC.CU;
  document.getElementById('fprog').textContent=(fIdx+1)+' / '+fList.length;
  document.getElementById('fen-f').textContent=c.en;
  document.getElementById('fen-f').style.color=fm.c;
  document.getElementById('fzh-f').textContent=c.zh;
  document.getElementById('fans').style.display='none';
  document.getElementById('ftap').style.display='block';
  fShown=false;
}
function revealCard(){
  if(fShown||!fList.length)return;
  var c=fList[fIdx];
  document.getElementById('fans').innerHTML=
    '<div class="frow"><span class="flbl">原型</span><span class="fval">'+(FC[c.f]||FC.CU).l+'</span></div>'+
    '<div class="frow"><span class="flbl">技法</span><span class="fval">'+c.m+' → '+c.g+'</span></div>'+
    '<div class="frow"><span class="flbl">基酒</span><span class="fval">'+(c.s||[]).join(', ')+'</span></div>'+
    '<div class="frow"><span class="flbl">配方</span><span class="fval">'+(c.r||[]).join(' / ')+'</span></div>'+
    '<div class="frow"><span class="flbl">風味</span><span class="fval">'+(c.fl||[]).join(' · ')+'</span></div>'+
    (c.brand?'<div class="frow"><span class="flbl">廠牌</span><span class="fval" style="color:#9ed4c4">'+c.brand.substring(0,80)+(c.brand.length>80?'…':'')+'</span></div>':'')+
    (c.n?'<div class="frow"><span class="flbl">筆記</span><span class="fval" style="color:#7a7068">'+c.n.substring(0,80)+(c.n.length>80?'…':'')+'</span></div>':'');
  document.getElementById('fans').style.display='block';
  document.getElementById('ftap').style.display='none';
  fShown=true;
}
function flashNext(){fIdx=(fIdx+1)%fList.length;renderFlash();}
function flashPrev(){fIdx=(fIdx-1+fList.length)%fList.length;renderFlash();}
function flashShuffle(){
  for(var i=fList.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=fList[i];fList[i]=fList[j];fList[j]=t;}
  fIdx=0;renderFlash();
}

// ── TABS ──
function switchTab(t){
  ['l','f','a'].forEach(function(x){
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
    document.getElementById(x+'view').style.display=x===t?'block':'none';
  });
  if(t==='f'){fList=filtered.slice();fIdx=0;renderFlash();}
}

// ── TOAST ──
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2200);
}

// ── INIT ──
updateHeader();doFilter();renderFlash();
</script>
</body>
</html>
